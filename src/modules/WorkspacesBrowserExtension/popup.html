<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspaces Tab Sync</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }

      button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 4px;
        border: 1px solid transparent;
        background: #0067c0;
        color: #fff;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      ul {
        list-style: none;
        margin: 8px 0;
        padding: 0;
        max-height: 320px;
        overflow-y: auto;
      }

      li {
        padding: 6px 4px;
        border-bottom: 1px solid rgba(128, 128, 128, 0.25);
      }

      .title {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .url {
        opacity: 0.7;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #status {
        margin-top: 8px;
        opacity: 0.8;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Workspaces Tab Sync</h1>
      <button id="sync" type="button">Sync URLs</button>
    </header>

    <ul id="tabs"></ul>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
